# Ambiente Docker Compose per testare l'intera solution in Docker Desktop senza SDK .NET
# installato in locale. Scritto a mano, modellato sull'output che genera nativamente
# `aspire publish` a partire da AddDockerComposeEnvironment("env") in AppHost.cs — vedi
# docker/README.md per i dettagli e per come rigenerarlo con la Aspire CLI.
#
# Le porte esposte sull'host sono parametrizzate tramite il file .env in questa stessa
# cartella (letto automaticamente da Docker Compose) — modifica quello se ti servono
# porte diverse, non serve toccare questo file.

services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: aspire-dashboard
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "${ASPIRE_DASHBOARD_PORT:-18888}:18888" # UI -> http://localhost:<porta>
      - "${ASPIRE_DASHBOARD_OTLP_PORT:-18889}:18889" # OTLP gRPC endpoint
    networks: [techinterview]

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [techinterview]

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${REDIS_COMMANDER_PORT:-8084}:8081" # UI, per ispezionare le chiavi cacheate a mano
    depends_on:
      redis:
        condition: service_healthy
    networks: [techinterview]

  airportsservice:
    build:
      context: ..
      dockerfile: src/AirportsService/Dockerfile
    container_name: airportsservice
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: airportsservice
    ports:
      - "${AIRPORTS_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [techinterview]

  flightsservice:
    build:
      context: ..
      dockerfile: src/FlightsService/Dockerfile
    container_name: flightsservice
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Porta HTTP/1.1 separata, solo per l'healthcheck: vedi il commento in
      # src/FlightsService/Program.cs sul perche' non puo' condividere la porta 8080
      # (HTTP/2 puro, richiesta dai client gRPC) senza TLS.
      FLIGHTS_HEALTH_PORT: "8090"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: flightsservice
    ports:
      - "${FLIGHTS_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [techinterview]

  globalsearchservice:
    build:
      context: ..
      dockerfile: src/GlobalSearchService/Dockerfile
    container_name: globalsearchservice
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: globalsearchservice
      Services__airportsservice__http__0: http://airportsservice:8080
      Services__flightsservice__http__0: http://flightsservice:8080
      ConnectionStrings__cache: redis:6379
    ports:
      - "${GLOBALSEARCH_PORT:-8083}:8080"
    depends_on:
      airportsservice:
        condition: service_healthy
      flightsservice:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [techinterview]

  webfrontend:
    build:
      context: ..
      dockerfile: src/TechInterview.Web/Dockerfile
    container_name: webfrontend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: webfrontend
      Services__airportsservice__http__0: http://airportsservice:8080
      Services__flightsservice__http__0: http://flightsservice:8080
      Services__globalsearchservice__http__0: http://globalsearchservice:8080
    ports:
      - "${WEBFRONTEND_PORT:-8080}:8080"
    depends_on:
      airportsservice:
        condition: service_healthy
      flightsservice:
        condition: service_healthy
      globalsearchservice:
        condition: service_healthy
    networks: [techinterview]

networks:
  techinterview:
    driver: bridge
